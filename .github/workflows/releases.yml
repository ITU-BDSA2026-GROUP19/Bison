name: .NET Release
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore Bison.CLI/Bison.CLI.csproj
      - name: Build
        run: dotnet build Bison.CLI/Bison.CLI.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test Bison.CLI/Bison.CLI.csproj --no-build --verbosity normal --configuration Release
    
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x


      - name: Publish linux-x64
        run: dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r linux-x64 -p:PublishSingleFile=true --self-contained false -o publish/linux-x64

      - name: Zip linux-x64
        run: zip -r linux-x64.zip publish/linux-x64/
      
      - name: Publish win-x64
        run: dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false -o publish/win-x64

      - name: Zip win-x64
        run: zip -r win-x64.zip publish/win-x64/

      - name: Publish macos-x64
        run: dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r osx-x64 -p:PublishSingleFile=true --self-contained false -o publish/macos-x64

      - name: Zip macos-x64
        run: zip -r macos-x64.zip publish/macos-x64/

      - name: Publish macos-arm64
        run: dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r osx-arm64 -p:PublishSingleFile=true --self-contained false -o publish/macos-arm64

      - name: Zip macos-arm64
        run: zip -r macos-arm64.zip publish/macos-arm64/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            linux-x64.zip
            win-x64.zip
            macos-x64.zip
            macos-arm64.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false